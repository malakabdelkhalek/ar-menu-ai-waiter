<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Storia di Jojo · Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ===== 1. COLORS & BASICS ===== */
    :root {
      --green: #1f6b3a;        /* Jojo's brand green */
      --green-dark: #154d29;
      --cream: #faf6ef;        /* page background */
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #7a7a7a;
      --gold: #c9a14a;         /* price + accents */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", sans-serif;
      background: var(--cream);
      color: var(--text);
      max-width: 520px;        /* phone-first: never wider than a big phone */
      margin: 0 auto;
      padding-bottom: 90px;    /* room for the "Ask Jojo" button */
    }

    /* ===== 2. HEADER ===== */
    header {
      background: var(--green);
      color: white;
      text-align: center;
      padding: 28px 16px 20px;
    }
    header h1 { font-family: "Playfair Display", serif; font-size: 28px; }
    header p  { font-size: 13px; opacity: .85; margin-top: 4px; font-style: italic; }

    /* ===== 3. CATEGORY TABS ===== */
    .tabs {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      position: sticky; top: 0;            /* tabs stay visible while scrolling */
      background: var(--cream);
      z-index: 5;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      border: 1.5px solid var(--green);
      border-radius: 999px;
      background: transparent;
      color: var(--green);
      font: 600 14px "Inter", sans-serif;
      cursor: pointer;
    }
    .tab.active { background: var(--green); color: white; }

    /* ===== 4. DISH CARDS ===== */
    .list { padding: 4px 16px; display: grid; gap: 12px; }
    .card {
      display: flex; gap: 14px; align-items: center;
      background: var(--card);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      cursor: pointer;
      transition: transform .15s;
    }
    .card:active { transform: scale(.98); }
    .photo {                                /* placeholder until real photos */
      width: 72px; height: 72px; flex-shrink: 0;
      border-radius: 12px;
      background: #eef3ee;
      display: grid; place-items: center;
      font-size: 32px;
    }
    .info h3 { font-size: 16px; font-weight: 600; }
    .info p  { font-size: 13px; color: var(--muted); margin: 3px 0 6px;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price   { color: var(--gold); font-weight: 600; font-size: 15px; }
    /* Dishes Jojo recommended: gold border + badge */
    .card.picked { outline: 3px solid var(--gold); position: relative; }
    .card.picked::after { content: "★ Jojo's pick"; position: absolute; top: -10px; right: 12px;
                          background: var(--gold); color: white; font-size: 11px; font-weight: 600;
                          padding: 3px 9px; border-radius: 999px; }

    /* ===== 5. DETAIL PANEL (opens when a dish is tapped) ===== */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 20;
    }
    .overlay.open { display: flex; }
    .sheet {
      background: var(--card);
      width: 100%; max-width: 520px;
      border-radius: 22px 22px 0 0;
      padding: 22px 20px 30px;
      max-height: 85vh; overflow-y: auto;
      animation: slideUp .25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet .photo { width: 100%; height: 220px; font-size: 64px; margin-bottom: 16px; }
    .photo { overflow: hidden; }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sheet h2 { font-family: "Playfair Display", serif; font-size: 24px; }
    .sheet .price { font-size: 18px; display: block; margin: 4px 0 12px; }
    .sheet h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 16px 0 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: #eef3ee; color: var(--green-dark); font-size: 12px; padding: 5px 10px; border-radius: 999px; }
    .note { font-size: 12px; color: var(--muted); margin-top: 16px; font-style: italic; }
    .close { margin-top: 20px; width: 100%; padding: 12px; border: none; border-radius: 12px;
             background: var(--green); color: white; font: 600 15px "Inter", sans-serif; cursor: pointer; }

    /* ===== 6. "ASK JOJO" BUTTON (AI waiter comes in step 4) ===== */
    .ask {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--gold); color: white;
      border: none; border-radius: 999px;
      padding: 14px 26px;
      font: 600 15px "Inter", sans-serif;
      box-shadow: 0 6px 18px rgba(0,0,0,.2);
      cursor: pointer; z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <h1>La Storia di Jojo</h1>
    <p>Every moment has its story</p>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main class="list" id="list"></main>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <button class="ask" onclick="JojoChat.open()">✨ Ask Jojo</button>

  <!-- ===== 7. MENU DATA: loaded from menu-data.js (shared with the AR page) ===== -->
  <script src="config.js"></script>
  <script src="menu-data.js"></script>
  <script src="jojo-chat.js"></script>

  <script>
    // ===== 8. READ THE DATA =====
    const items = window.MENU_ITEMS;

    const TABS = window.MENU_TABS;
    const ICON = window.MENU_ICONS;

    let currentTab = "Hot";
    let picked = new Set();          // ids of dishes Jojo recommended

    // ===== 9. DRAW THE TABS =====
    function renderTabs() {
      const nav = document.getElementById("tabs");
      nav.innerHTML = "";
      for (const key in TABS) {
        const btn = document.createElement("button");
        btn.className = "tab" + (key === currentTab ? " active" : "");
        btn.textContent = TABS[key].label;
        btn.onclick = () => { currentTab = key; renderTabs(); renderList(); };
        nav.appendChild(btn);
      }
    }

    // ===== 10. DRAW THE DISH CARDS =====
    function renderList() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      const visible = items.filter(it => TABS[currentTab].match.includes(it.category));

      for (const it of visible) {
        const card = document.createElement("div");
        card.className = "card" + (picked.has(it.id) ? " picked" : "");
        card.innerHTML = `
          <div class="photo"></div>
          <div class="info">
            <h3>${it.name}</h3>
            <p>${it.description || "Ask the staff for details."}</p>
            <span class="price">${it.price.toFixed(2)} DT</span>
          </div>`;
        fillPhotoBox(card.querySelector(".photo"), it);     // real photo if there is one
        card.onclick = () => openDish(it);
        list.appendChild(card);
      }
    }

    // ===== 11. DISH DETAIL PANEL =====
    function openDish(it) {
      document.getElementById("sheet").innerHTML = `
        <div class="photo"></div>
        <h2>${it.name}</h2>
        <span class="price">${it.price.toFixed(2)} DT</span>
        <p>${it.description || "Description coming soon. Ask the staff for details."}</p>

        <h4>Ingredients</h4>
        <div class="chips">${it.ingredients.map(i => `<span class="chip">${i}</span>`).join("")}</div>

        <h4>Good for</h4>
        <div class="chips">${it.tags.map(t => `<span class="chip">#${t}</span>`).join("")}</div>

        <p class="note">Allergies? Please check with the staff before ordering.</p>
        <button class="close" onclick="closeDish()">Back to menu</button>`;
      fillPhotoBox(document.querySelector("#sheet .photo"), it);
      document.getElementById("overlay").classList.add("open");
    }

    function closeDish() {
      document.getElementById("overlay").classList.remove("open");
    }

    // Tapping the dark area outside the panel also closes it
    document.getElementById("overlay").onclick = (e) => {
      if (e.target.id === "overlay") closeDish();
    };

    // ===== 12. START =====
    renderTabs();
    renderList();

    // ===== 13. WHEN JOJO RECOMMENDS DISHES =====
    // Highlight them, and jump to the tab of the first pick.
    window.onJojoPicks = (ids) => {
      picked = new Set(ids);
      const first = items.find(it => it.id === ids[0]);
      currentTab = Object.keys(TABS).find(k => TABS[k].match.includes(first.category));
      renderTabs(); renderList();
    };
  </script>
</body>
</html>
